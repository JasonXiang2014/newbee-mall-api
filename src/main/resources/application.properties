spring.profiles.active=dev

server.port=28019
spring.datasource.name=newbee-mall-datasource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/newbee_mall_db_v2?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true&allowPublicKeyRetrieval=true&authPlugin=mysql_native_password
spring.datasource.username=root
spring.datasource.password=qwer1234
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=hikariCP
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# mybatis config
mybatis.mapper-locations=classpath:mapper/*Mapper.xml

# logging.level.ltd.newbee.mall.dao=debug

spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**,public/**

# ===================== \u8DE8\u57DF\u6838\u5FC3\u914D\u7F6E\uFF08\u5DF2\u586B\u4F60\u7684\u963F\u91CC\u4E91IP\uFF09=====================
# \u5141\u8BB8\u7684\u8DE8\u57DF\u6E90\uFF1A\u524D\u7AEF\u90E8\u7F72\u7684\u963F\u91CC\u4E91\u670D\u52A1\u5668\u5730\u5740\uFF08\u524D\u7AEF\u9875\u9762\u8BBF\u95EE\u5730\u5740\uFF0C80\u7AEF\u53E3\u9ED8\u8BA4\u7701\u7565\uFF09
spring.web.cors.allowed-origins=http://39.97.54.165
# \u5141\u8BB8\u6240\u6709HTTP\u8BF7\u6C42\u65B9\u6CD5\uFF08GET/POST/PUT/DELETE\u7B49\uFF0C\u5F00\u53D1/\u751F\u4EA7\u90FD\u5EFA\u8BAE\u914D*\uFF09
spring.web.cors.allowed-methods=*
# \u5141\u8BB8\u6240\u6709\u8BF7\u6C42\u5934\uFF08\u5982Token/Content-Type\u7B49\uFF0C\u907F\u514D\u524D\u7AEF\u4F20\u53C2\u88AB\u62E6\u622A\uFF09
spring.web.cors.allowed-headers=*
# \u5141\u8BB8\u8DE8\u57DF\u643A\u5E26Cookie/Session\uFF08\u548C\u4F60\u524D\u7AEFaxios\u7684withCredentials=true\u4E25\u683C\u5BF9\u5E94\uFF0C\u5FC5\u987B\u5F00\uFF09
spring.web.cors.allow-credentials=true
# \u53EF\u9009\uFF1A\u8DE8\u57DF\u8BF7\u6C42\u6709\u6548\u671F\uFF08\u79D2\uFF09\uFF0C\u907F\u514D\u6D4F\u89C8\u5668\u9891\u7E41\u53D1\u9884\u68C0\u8BF7\u6C42\uFF0C\u63D0\u5347\u6027\u80FD
spring.web.cors.max-age=3600

# ===================== \u65E5\u5FD7\u6301\u4E45\u5316\u914D\u7F6E\uFF08\u5DF2\u586B\u4F60\u7684\u9879\u76EE\u5305\u540D\uFF09=====================
# \u6839\u65E5\u5FD7\u7EA7\u522B\uFF1AINFO\uFF08\u751F\u4EA7\u73AF\u5883\u4E0D\u7528DEBUG\uFF0C\u907F\u514D\u65E5\u5FD7\u592A\u591A\u5360\u7A7A\u95F4\uFF09
logging.level.root=INFO
# \u4F60\u7684\u9879\u76EE\u5305\u540D\u65E5\u5FD7\u7EA7\u522B\uFF1AINFO\uFF08\u6307\u5B9A\u9879\u76EE\u5305\uFF0C\u65E5\u5FD7\u4F1A\u66F4\u7CBE\u51C6\uFF0C\u5B9A\u4F4D\u95EE\u9898\u66F4\u5FEB\uFF09
logging.level.ltd.newbee.mall=INFO
# \u65E5\u5FD7\u6587\u4EF6\u5B58\u50A8\u76EE\u5F55\uFF08\u5BB9\u5668\u5185\u56FA\u5B9A\u76EE\u5F55\uFF0C\u65B9\u4FBF\u540E\u7EEDDocker\u6302\u8F7D\u5230\u670D\u52A1\u5668\u672C\u5730\uFF09
logging.file.path=/app/logs
# \u65E5\u5FD7\u6587\u4EF6\u5177\u4F53\u540D\u79F0\uFF08\u7EC4\u5408\u8DEF\u5F84\uFF1A/app/logs/project.log\uFF09
logging.file.name=/app/logs/project.log
# \u53EF\u9009\uFF1A\u65E5\u5FD7\u6587\u4EF6\u6EDA\u52A8\u7B56\u7565\uFF08\u907F\u514D\u5355\u4E2A\u65E5\u5FD7\u6587\u4EF6\u8FC7\u5927\uFF0C\u81EA\u52A8\u5206\u5272\uFF09
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.file-name-pattern=/app/logs/project-%d{yyyy-MM-dd}.%i.log

# \u65F6\u533A\u914D\u7F6E
spring.jackson.time-zone=Asia/Shanghai